# .github/ISSUE_TEMPLATE/project_application.yml

name: "🚀 项目复现任务申请"
description: "通过此模板，正式申请复现一个AI项目"
title: "[任务申请] <请在此填写您要复现的项目名称>"
labels: ["task-application", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ### 感谢您申请参与 Lab4AI 的项目复现！
        在提交前，请确保您已仔细阅读我们的 **[贡献指南](https://github.com/Lab4AI-Hub/ProjectHub/blob/main/CONTRIBUTING.md)**，并已准备好开始复现工作。

  - type: input
    id: project-name
    attributes:
      label: 项目名称
      description: "您希望复现的项目的准确名称。"
      placeholder: "例如：Real-Time Voice Cloning"
    validations:
      required: true

  - type: input
    id: project-link
    attributes:
      label: 项目原始链接 (GitHub/Hugging Face等)
      description: "请提供该项目的开源仓库地址或官方页面链接。"
      placeholder: "https://github.com/CorentinJ/Real-Time-Voice-Cloning"
    validations:
      required: true
      
  - type: textarea
    id: reason
    attributes:
      label: 申请理由与个人优势
      description: "请简要说明您为什么选择这个项目进行复现，以及您具备的相关经验或优势。"
      placeholder: "我对该领域的...技术比较熟悉，希望能通过复现加深理解..."
    validations:
      required: true

- type: input
    id: affiliation
    attributes:
      label: 您的所属机构 (Your Affiliation)
      description: "请填写您所在的学校、企业或团队名称。例如：北京大学、Lab4AI内部团队、开源社区贡献者。"
      placeholder: "例如：清华大学"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: 项目类型
      description: "请为该项目选择一个最合适的分类。"
      multiple: false
      options:
        - "AIGC (内容生成)"
        - "多模态 (Multi-modal)"
        - "CV (计算机视觉)"
        - "NLP (自然语言处理)"
        - "AI Agent"
        - "其他"
    validations:
      required: true
